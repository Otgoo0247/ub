<!doctype html>
<html lang="mn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <title>Нэвтрэх · Улаанбаатар хотын дашбоард</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/login.css">
  <script src="js/login.js" defer></script>
</head>
<body>
  <main class="lg">
    <section class="lg-intro">
      <p class="lg-pill">Улаанбаатар · дотоод хэрэглээ</p>
      <h1 class="lg-title">Хүн ам, гишүүнчлэлийн <span>дашбоард</span></h1>
      <p class="lg-lead">Дүүрэг, хороо бүрийн хүн ам, сонгуулийн насны иргэд, гишүүдийн мэдээллийг харахын тулд нэвтэрнэ үү.</p>
    </section>
    <form class="lg-card" id="lg-form" novalidate>
      <h2 class="lg-h2">Нэвтрэх</h2>
      <label class="lg-field"><span>Нэвтрэх нэр</span>
        <input type="text" name="username" id="lg-user" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
      <label class="lg-field"><span>Нууц үг</span>
        <input type="password" name="password" id="lg-pass" autocomplete="current-password" required></label>
      <p class="lg-msg" id="lg-msg" role="alert"></p>
      <button type="submit" class="lg-btn" id="lg-btn">Нэвтрэх <span aria-hidden="true">→</span></button>
      <p class="lg-note">Нэвтрэлт 12 цаг хүчинтэй. Нийтийн компьютер дээр ажлаа дуусгаад «Гарах» товчийг дарна уу.</p>
    </form>
  </main>
  <noscript><p class="lg-msg">Нэвтрэхэд JavaScript шаардлагатай.</p></noscript>
</body>
</html>
