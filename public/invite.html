<!doctype html>
<html lang="mn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <title>Урилга</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/login.css">
  <script src="/js/invite.js" defer></script>
</head>
<body>
  <main class="lg">
    <section class="lg-intro">
      <p class="lg-pill">Урилга</p>
      <h1 class="lg-title">Танд <span>урилга</span> ирлээ</h1>
      <p class="lg-lead" id="iv-lead">Урилгыг шалгаж байна…</p>
    </section>
    <section class="lg-card" id="iv-card" hidden>
      <h2 class="lg-h2">Урилгын код</h2>
      <p class="iv-code" id="iv-code"></p>
      <button type="button" class="iv-copy" id="iv-copy">Кодыг хуулах</button>
      <a class="lg-btn iv-join" id="iv-join" hidden>Бүртгүүлэх <span aria-hidden="true">→</span></a>
      <p class="lg-note" id="iv-note">Бүртгүүлэхдээ энэ кодыг «Урилгын код» хэсэгт оруулна уу.</p>
    </section>
  </main>
  <noscript><p class="lg-msg">Урилгыг харахад JavaScript шаардлагатай.</p></noscript>
</body>
</html>
