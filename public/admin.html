<!doctype html>
<html lang="mn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <title>Админ хэсэг</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script src="js/role.js?v=20261120-18"></script>
  <link rel="stylesheet" href="css/tokens.css?v=20261120-18">
  <link rel="stylesheet" href="css/ub.css?v=20261120-18">
  <link rel="stylesheet" href="css/tree.css?v=20261120-18">
  <link rel="stylesheet" href="css/ann.css?v=20261120-18">
  <link rel="stylesheet" href="css/me.css?v=20261120-8">
  <link rel="stylesheet" href="css/irts.css?v=20261120-18">
  <link rel="stylesheet" href="css/admin.css?v=20261120-18">
  <script src="js/d3.min.js?v=20261120-18" defer></script>
  <script src="js/tree.js?v=20261120-18" defer></script>
  <script src="js/xlsx-lite.js?v=20261120-18" defer></script>
  <script src="js/ann.js?v=20261120-18" defer></script>
  <script src="js/announce.js?v=20261120-18" defer></script>
  <script src="js/session.js?v=20261120-18" defer></script>
  <script src="js/minimap.js?v=20261120-18" defer></script>
  <script src="js/admin.js?v=20261120-18" defer></script>
</head>
<body data-require="admin">
  <main id="dash-root">
    <div class="ub adm" id="ub">
      <header class="ub-head">
        <div class="ub-userbar"><span class="ub-user" id="ub-user"></span><a class="ub-btn ub-btn-ghost adm-back" href="/">← Дашбоард</a><button type="button" class="ub-btn ub-btn-ghost" id="ub-logout">Гарах</button></div>
        <div class="ub-title-row"><img class="ub-logo" src="logo.png?v=20261120-1" alt="SDS лого" width="60" height="60"><h1 class="ub-title">Админ хэсэг</h1></div>
      </header>

      <nav class="adm-tabs" role="tablist" aria-label="Админ хэсгүүд">
        <button type="button" role="tab" class="adm-tab" id="tab-people" aria-controls="adm-people" aria-selected="true">Урьсан хүмүүс</button>
        <button type="button" role="tab" class="adm-tab" id="tab-ann" aria-controls="adm-ann" aria-selected="false">Үйл ажиллагааны зарлал</button>
        <button type="button" role="tab" class="adm-tab" id="tab-att" aria-controls="adm-att" aria-selected="false">Ирц</button>
        <button type="button" role="tab" class="adm-tab" id="tab-cfg" aria-controls="adm-cfg" aria-selected="false">Тохиргоо</button>
      </nav>

      <section class="adm-pane" id="adm-people" role="tabpanel" aria-labelledby="tab-people">
        <div class="adm-kpis" id="adm-kpis"></div>
        <div class="ub-card">
          <div class="adm-bar">
            <div class="ub-segmini" role="group" aria-label="Харагдац">
              <button type="button" data-view="list" aria-pressed="true">Бүх бүртгүүлэгч</button>
              <button type="button" data-view="group" aria-pressed="false">Урьсан хүнээр</button>
            </div>
            <button type="button" class="ubt-open adm-alltree" id="adm-alltree" disabled><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M2 8h3c3 0 3-5 6-5h3M5 8c3 0 3 5 6 5h3M5 8h9"/></svg>Нийт урилгын мод</button>
            <label class="ub-field"><span>Хайх</span><input type="search" class="ub-names-q adm-q" id="adm-q" placeholder="Нэр, утас, урьсан хүн, код"></label>
            <label class="ub-field"><span>Оршин суугаа газар</span><select class="dash-select" id="adm-place"></select></label>
            <label class="ub-field"><span>Урьсан хүн</span><select class="dash-select" id="adm-kind">
              <option value="">Бүгд</option><option value="member">Намын гишүүн</option><option value="reg">Бүртгүүлэгч</option></select></label>
            <button type="button" class="ub-reset" id="adm-reset" hidden>Шүүлтүүр цэвэрлэх</button>
            <button type="button" class="ub-xl-btn is-big adm-xl" id="adm-xl">Excel-ээр татах</button>
          </div>
          <p class="adm-sum" id="adm-sum" role="status">Ачаалж байна…</p>
          <div id="adm-body"></div>
        </div>
      </section>

      <section class="adm-pane" id="adm-ann" role="tabpanel" aria-labelledby="tab-ann" hidden>
        <div class="ub-card" id="adm-ann-box"></div>
      </section>

      <section class="adm-pane" id="adm-att" role="tabpanel" aria-labelledby="tab-att" hidden>
        <div class="adm-kpis" id="att-kpis"></div>
        <div class="ub-card">
          <div class="adm-bar">
            <label class="ub-field ub-field-wide"><span>Үйл ажиллагаа</span><select class="dash-select" id="att-ev"></select></label>
            <label class="ub-field"><span>Огноо</span><input type="date" class="ub-names-q adm-q" id="att-date"></label>
            <label class="ub-field"><span>Хайх</span><input type="search" class="ub-names-q adm-q" id="att-q" placeholder="Нэр, код, хороо"></label>
            <button type="button" class="ub-reset" id="att-reset" hidden>Шүүлтүүр цэвэрлэх</button>
            <button type="button" class="me-ghost adm-refresh" id="att-refresh">↻ Шинэчлэх</button>
            <button type="button" class="ub-xl-btn is-big adm-xl" id="att-xl" disabled>Excel-ээр татах</button>
          </div>
          <p class="adm-sum" id="att-sum" role="status">Ачаалж байна…</p>
          <div class="att-grid" id="att-grid"></div>
        </div>
      </section>

      <section class="adm-pane" id="adm-cfg" role="tabpanel" aria-labelledby="tab-cfg" hidden>
        <div class="ub-card">
          <h2 class="adm-h2">Facebook групп</h2>
          <p class="adm-note">Урилгаар бүртгүүлсэн хүмүүсийн «Миний мэдээлэл» хуудсанд (/me) «Группт нэгдэх» товчтойгоор харагдана. Холбоосыг хоосон болгож хадгалвал хэсэг нуугдана.</p>
          <form class="adm-cfg-form" id="adm-fb-form" novalidate>
            <label class="adm-f"><span>Группын холбоос</span><input type="url" id="adm-fb-url" maxlength="300" placeholder="https://www.facebook.com/groups/…" autocomplete="off" spellcheck="false"></label>
            <label class="adm-f"><span>Тайлбар (заавал биш)</span><input type="text" id="adm-fb-text" maxlength="200" placeholder="Группт нэгдэж, үйл ажиллагааны мэдээллээ цаг алдалгүй аваарай."></label>
            <div class="adm-cfg-bar"><span class="ann-msg" id="adm-fb-msg" role="status"></span><button type="submit" class="ub-mdlg-btn is-brand" id="adm-fb-save">Хадгалах</button></div>
          </form>
          <p class="adm-sub">Гишүүдэд ингэж харагдана:</p>
          <div class="adm-fb-preview" id="adm-fb-preview"></div>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
