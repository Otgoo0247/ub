<!doctype html>
<html lang="mn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <title>Миний бүртгэл</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/tokens.css?v=20261119-4">
  <link rel="stylesheet" href="/css/me.css?v=20261120-12">
  <link rel="stylesheet" href="/css/tree.css?v=20261120-5">
  <link rel="stylesheet" href="/css/ann.css?v=20261120-12">
  <script src="/js/d3.min.js?v=20261120-5" defer></script>
  <script src="/js/tree.js?v=20261120-5" defer></script>
  <script src="/js/ann.js?v=20261120-12" defer></script>
  <script src="/js/me.js?v=20261120-12" defer></script>
</head>
<body>
  <main class="me">
    <header class="me-top">
      <p class="me-pill">Гишүүний хуудас</p>
      <div class="me-topr"><a class="me-ghost" href="/" id="me-dash" hidden>← Дашбоард</a><a class="me-ghost me-irts" href="/irts" id="me-irts" hidden>Ирц бүртгүүлэх</a><button type="button" class="me-ghost" id="me-logout" hidden>Гарах</button></div>
    </header>
    <p class="me-welcome" id="me-welcome" role="status" hidden></p>
    <p class="me-note" id="me-status">Ачаалж байна…</p>

    <section class="me-card" id="me-profile" hidden>
      <p class="me-eyebrow">Миний мэдээлэл</p>
      <h1 class="me-name" id="me-name"></h1>
      <p class="me-sub" id="me-sub"></p>
      <dl class="me-dl" id="me-dl"></dl>
    </section>

    <section class="me-card me-cred" id="me-cred" hidden>
      <h2 class="me-h2">Миний нэвтрэх эрх</h2>
      <p class="me-hint" id="me-cred-hint">Дараа дахин нэвтрэхдээ <b>/login</b> хуудсанд энэ нэр, нууц үгийг ашиглана.</p>
      <div class="me-credrow" id="me-cu-row"><span>Нэвтрэх нэр</span><output id="me-cu"></output><button type="button" class="me-btn" id="me-cu-copy">Хуулах</button></div>
      <div class="me-credrow" id="me-cp-row"><span>Нууц үг</span><output id="me-cp">••••••••</output><button type="button" class="me-btn" id="me-cp-show">Харах</button><button type="button" class="me-btn" id="me-cp-copy">Хуулах</button></div>
      <div class="me-credrow" id="me-cc-row" hidden><span>Нэвтрэх код</span><output id="me-cc"></output><button type="button" class="me-btn" id="me-cc-copy">Хуулах</button></div>
    </section>

    <section class="me-card me-inv" id="me-invite" hidden>
      <h2 class="me-h2">Миний урилгын код</h2>
      <div class="me-row">
        <output class="me-code" id="me-code"></output>
        <button type="button" class="me-btn" id="me-copy-code">Код хуулах</button>
      </div>
      <div class="me-row">
        <input class="me-link" id="me-link" type="text" readonly aria-label="Урилгын холбоос">
        <button type="button" class="me-btn is-brand" id="me-copy-link">Холбоос хуулах</button>
      </div>
    </section>

    <section class="me-card" id="me-people" hidden>
      <div class="ubt-headrow me-people-head"><h2 class="me-h2" id="me-people-t"></h2><button type="button" class="ubt-open" id="me-tree" hidden><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M2 8h3c3 0 3-5 6-5h3M5 8c3 0 3 5 6 5h3M5 8h9"/></svg>Урилгын мод</button></div>
      <ul class="me-list" id="me-list"></ul>
    </section>
  </main>
</body>
</html>
